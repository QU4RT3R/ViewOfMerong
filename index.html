<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전지적 메롱 시점</title>
<style>
:root{
  --bg:#fff;--panel:#f6f9fc;--line:#e4e9ef;--line2:#d4dce5;--text:#1e2a36;--sub:#677686;--faint:#9aa6b2;
  --ac:#4fb3ea;--ac2:#2392d0;--acs:#eaf6fd;--acs2:#cfeafa;
  --err:#e5484d;--errs:#fdeeee;--warn:#ee8a00;--warns:#fff4e3;--ok:#2f9e6b;--oks:#e7f6ee;
  --r:10px;--sh:0 1px 2px rgba(20,40,60,.05),0 6px 18px rgba(20,40,60,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.55}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
a{color:inherit}

/* 시작 화면 */
.start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff 0%,#f1f9fe 100%);z-index:50}
.st-box{text-align:center;padding:40px}
.st-logo{font-size:40px;font-weight:800;letter-spacing:-1px}
.st-logo b{color:var(--ac)}
.st-sub{color:var(--sub);margin:6px 0 32px}
.st-btns{display:flex;flex-direction:column;gap:10px;width:280px;margin:0 auto}
.st-btns .btn{padding:12px 16px;font-size:15px;display:flex;flex-direction:column;align-items:center}
.st-btns small{font-size:11.5px;color:var(--sub);font-weight:400}
.st-note{margin-top:24px;font-size:12px;color:var(--faint)}

/* 레이아웃 */
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr 30px;height:100vh}
.app.folded{grid-template-columns:0 1fr}
.app.folded .side{display:none}
.side{grid-row:1;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:auto}
.sd-h{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 4px 18px}
.logo{font-weight:800;font-size:16px;letter-spacing:-.3px}
.logo b{color:var(--ac)}
.sd-fold{border:none;background:none;color:var(--faint);font-size:16px;padding:2px 6px;border-radius:6px}
.sd-fold:hover{background:var(--line)}
.sd-proj{padding:0 18px 14px;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-list{padding:4px 10px;flex:1}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--text)}
.nav:hover{background:#edf2f7}
.nav.on{background:var(--acs);color:var(--ac2);font-weight:700}
.nav .ic{width:18px;text-align:center;color:var(--faint)}
.nav.on .ic{color:var(--ac)}
.nav .bd{margin-left:auto;display:flex;gap:4px}
.nav.dis{color:var(--faint);cursor:default}
.nav.dis:hover{background:none}
.nav.dis small{margin-left:auto;font-size:11px}
.bdg{font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;border-radius:9px;text-align:center;color:#fff;font-weight:700}
.bdg.e{background:var(--err)}.bdg.w{background:var(--warn)}
.sd-foot{padding:12px 14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.mini-l{font-size:11.5px;color:var(--sub);font-weight:600}
.unfold{position:fixed;left:8px;top:10px;z-index:30;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:4px 9px;color:var(--sub);box-shadow:var(--sh)}
main{grid-row:1;overflow:auto;padding:28px 36px 60px;position:relative}
main.full{padding:0;overflow:hidden}

/* 상태 표시줄 */
.status{grid-column:1/-1;grid-row:2;display:flex;align-items:center;gap:4px;padding:0 10px;font-size:12px;background:var(--panel);border-top:1px solid var(--line);color:var(--sub)}
.st-item{border:none;background:none;padding:3px 8px;border-radius:5px;color:var(--sub)}
.st-item:hover{background:var(--line)}
.st-err{color:var(--err)!important;font-weight:600}
.st-warn{color:var(--warn)!important;font-weight:600}
.status .sp{flex:1}
.status .st-txt{padding:0 8px}
.probs{position:fixed;left:0;right:0;bottom:30px;height:42vh;background:#fff;border-top:1px solid var(--line2);box-shadow:0 -6px 20px rgba(20,40,60,.08);z-index:40;display:flex;flex-direction:column}
.pb-h{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line)}
.pb-h .mini{color:var(--sub);font-size:12px}
.pb-h button{margin-left:auto}
.pb-body{overflow:auto;padding:8px 16px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pb-t{font-weight:700;margin:6px 0}
.pb-t span{font-weight:400;color:var(--sub);margin-left:4px}
.pb-it{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;border-left:3px solid transparent}
.pb-it:hover{background:var(--panel);border-left-color:var(--ac)}
.pb-l{font-size:11.5px;color:var(--sub)}
.pb-x{font-size:13px}
.pb-none{color:var(--faint);font-size:12.5px;padding:4px 8px}

/* 공통 요소 */
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--ac);color:var(--ac2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--ac2);border-color:var(--ac2);color:#fff}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line);color:var(--text)}
.btn.danger{color:var(--err)}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn.dangerf{background:var(--err);border-color:var(--err);color:#fff}
.btn.wide{width:100%}
.inp{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.inp.big{font-size:20px;font-weight:700;padding:8px 12px}
.inp.xs{padding:3px 7px;font-size:12.5px;width:auto}
.inp.num{width:74px}
textarea.inp{resize:vertical;line-height:1.65;min-height:38px}
select.inp{padding:6px 8px}
.field{margin-bottom:16px}
.field>label,.lbl{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600}
.req{color:var(--err);margin-left:3px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
.chk input{accent-color:var(--ac);margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--acs);color:var(--ac2);font-size:12.5px;line-height:1.6}
.chip button{border:none;background:none;padding:0;color:inherit;opacity:.6;font-size:11px}
.chip button:hover{opacity:1}
.chip.gray{background:#eef2f6;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.h3{font-size:15px;font-weight:700;margin:26px 0 10px}
.desc{color:var(--sub);margin:0 0 20px;font-size:13px}
.page{max-width:1100px}
.page.narrow{max-width:900px}
.page.wide{max-width:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:4px 11px;font-size:12.5px;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--acs);color:var(--ac2);font-weight:700}
.seg.full{display:flex}
.seg.full button{flex:1}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:36px;text-align:center;color:var(--sub);background:#fcfdfe}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.mini{font-size:12px;color:var(--sub)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.dot.e{background:var(--err)}
.dia{color:var(--warn);font-size:11px;line-height:1}
.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--ac)}100%{box-shadow:0 0 0 0 rgba(79,179,234,0)}}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--text)}

/* 서식 있는 글 */
.hintbar{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.hintbar .tb{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:1px 8px;font-size:12px;color:var(--sub)}
.hintbar .tb:hover{border-color:var(--ac);color:var(--ac2)}
.hintbar .tb.u{color:var(--err)}
.hintbar .tb.f{color:var(--warn)}
.hintbar .sp{flex:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair.stack{grid-template-columns:1fr}
.pv{border:1px dashed var(--line2);border-radius:8px;padding:9px 12px;background:#fcfdfe;overflow:auto;max-height:72vh;min-height:38px;word-break:break-word}
.pv-l{font-size:11px;color:var(--faint);margin-bottom:2px}
.rich{line-height:1.75;word-break:break-word}
.ph-t{color:var(--faint)}
.undec{text-decoration:underline wavy var(--err);text-decoration-thickness:1.5px;text-underline-offset:4px;background:var(--errs);border-radius:2px}
.lk{color:var(--ac2);cursor:pointer;text-decoration:none;background:var(--acs);border-bottom:1px solid var(--acs2);border-radius:3px;padding:0 2px}
.lk:hover{background:var(--acs2)}
.lk.char{background:none;border-bottom:2px solid var(--c,var(--ac));color:var(--text);font-weight:600;border-radius:0;padding:0}
.lk.broken{color:var(--err);background:none;border-bottom:1px dashed var(--err);border-radius:0}
.fsx{color:#b86400;background:var(--warns);border-bottom:2px solid var(--warn);border-radius:3px;padding:0 3px;cursor:pointer;font-weight:600}
.fsx.done{color:var(--ok);background:var(--oks);border-color:var(--ok)}
.fsx.drop{color:var(--faint);background:#f1f3f5;border-color:var(--faint);text-decoration:line-through}
.fsx.miss{color:var(--err);background:none;border-bottom:1px dashed var(--err)}
sup.fn{color:var(--ac2);font-size:11px;cursor:pointer;margin-left:1px}
.footnotes{border-top:1px solid var(--line);margin-top:14px;padding-top:8px;font-size:12.5px;color:var(--sub);line-height:1.7}
.footnotes a{color:var(--ac2);cursor:pointer;text-decoration:none}
body.namu .lk.term{background:none;border:none;padding:0;border-radius:0}
body.namu .lk.term:hover{text-decoration:underline}
.dl-line{display:grid;grid-template-columns:minmax(56px,auto) 1fr;gap:12px;margin:3px 0}
.dl-sp{font-weight:700;color:var(--c,#7a8896);text-align:right}
.dl-dir{color:var(--sub);font-style:italic;margin:6px 0;padding-left:6px;border-left:2px solid var(--line)}
.dl-gap{height:8px}

/* 툴팁, 모달, 알림 */
.tip{position:fixed;z-index:60;max-width:270px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:9px 12px;font-size:12.5px;pointer-events:none}
.tip img{width:48px;height:48px;object-fit:contain;float:left;margin-right:8px;border-radius:6px;background:var(--panel)}
.tp-c{font-size:11px;color:var(--sub)}
.md-bg{position:fixed;inset:0;background:rgba(20,30,40,.28);display:flex;align-items:center;justify-content:center;z-index:70}
.md{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:20px;width:min(420px,92vw)}
.md-t{font-weight:700;font-size:16px;margin-bottom:8px}
.md-m{color:var(--sub);margin-bottom:12px;font-size:13.5px}
.md .inp{margin-bottom:4px}
.md-b{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:#1e2a36;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* 기본 정보 */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:12px;color:var(--sub)}
.stat.e b{color:var(--err)}.stat.w b{color:var(--warn)}
.info-top{display:flex;gap:18px;align-items:flex-start}
.cover{width:132px;height:132px;flex:none;border:1px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--faint);font-size:12px;cursor:pointer;overflow:hidden;background:#fcfdfe;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover:hover{border-color:var(--ac)}
.grow{flex:1;min-width:0}
.kv{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.kv-row{display:grid;grid-template-columns:170px 1fr auto;gap:8px;align-items:start}
.kv-row .inp.kv-l{font-weight:600;background:var(--panel)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.sugg .chip{cursor:pointer;border:none}
.sugg .chip:hover{background:var(--acs2)}

/* 연표 */
.tl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:calc(100vh - 230px)}
.tl{display:grid;width:max-content;min-width:100%}
.tl>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
.tl .tl-hd{position:sticky;top:0;background:var(--panel);font-weight:700;font-size:12.5px;z-index:2;white-space:nowrap}
.tl .tl-ln{position:sticky;left:0;background:var(--panel);font-weight:600;font-size:12.5px;color:var(--sub);z-index:1}
.tl .tl-corner{position:sticky;left:0;top:0;z-index:3;background:var(--panel)}
.tl .tl-gap{background:repeating-linear-gradient(135deg,#f7f9fb,#f7f9fb 6px,#eef2f6 6px,#eef2f6 12px);color:var(--faint);font-size:11px;writing-mode:vertical-rl;text-align:center;padding:8px 2px}
.tl .tl-hd.tl-gap{writing-mode:vertical-rl}
.tl-cell{display:flex;flex-direction:column;gap:5px;min-height:48px}
.tl-it{border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:6px;padding:4px 7px;font-size:12.5px;cursor:pointer;background:#fff;line-height:1.4}
.tl-it:hover{box-shadow:var(--sh)}
.tl-it.k-node{border-left-color:#8b7cf6;background:#f7f5ff}
.tl-it.k-term{border-left-color:#3fbf8f;background:#f2fbf6}
.tl-it.sel{box-shadow:0 0 0 2px var(--ac)}
.tl-it.is-undec{text-decoration:underline wavy var(--err);text-underline-offset:3px}
.tl-d{display:block;font-size:11px;color:var(--sub)}
.tl-tray{margin-top:14px}
.page:has(.drawer) #tlBoard{margin-right:376px}
.drawer{position:fixed;right:16px;top:118px;bottom:46px;width:360px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(20,40,60,.14);overflow:auto;padding:16px 18px;z-index:20}
.dr-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tl-legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin:10px 0}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 스토리 */
.story{display:grid;grid-template-columns:290px 1fr;height:100%}
.tree{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 12px 30px;display:flex;flex-direction:column;gap:8px}
.tree-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.legend{font-size:11.5px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 4px}
.lv{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;line-height:17px;flex:none}
.lv1{background:#dff1fc;color:#1f7fb8}.lv2{background:#ebe7fd;color:#6a5bd6}.lv3{background:#e7f6ee;color:#2a8a5c}
.tr{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:13px;position:relative}
.tr:hover{background:#e9eff5}
.tr.sel{background:#fff;box-shadow:0 0 0 1px var(--ac) inset}
.tr.l2{margin-left:14px}.tr.l3{margin-left:28px;font-size:12.5px}
.tr.l1{font-weight:700;margin-top:6px}
.tr-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-m{display:flex;gap:3px;align-items:center}
.tr-tools{display:none;gap:1px}
.tr:hover .tr-tools{display:flex}
.tr-tools button{border:none;background:none;font-size:11px;color:var(--sub);padding:1px 4px;border-radius:4px}
.tr-tools button:hover{background:#fff;color:var(--ac2)}
.ed{overflow:auto;padding:24px 34px 60px}
.crumb{font-size:12px;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ed-top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.ed-top .inp{flex:1}
.child-list{display:flex;flex-direction:column;gap:8px}
.child{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:#fff}
.child:hover{border-color:var(--ac)}
.child b{display:block;margin-bottom:2px}
.child .mini{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.side-sec{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.side-sec h4{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.mm{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:13px;display:flex;gap:8px;align-items:flex-start;background:#fff}
.mm.done{opacity:.5;text-decoration:line-through}
.doc h2{font-size:20px;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--acs2)}
.doc h3{font-size:16px;margin:20px 0 6px;color:#3d3270}
.doc h4{font-size:14px;margin:14px 0 4px;color:#2a7a54}
.doc .dt{font-size:12px;color:var(--sub);margin-left:6px;font-weight:400}

/* 캐릭터·용어 공통 */
.split{display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
.list-col{position:sticky;top:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:calc(100vh - 110px);overflow:auto}
.lc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.grp{font-size:11.5px;font-weight:700;color:var(--sub);margin:12px 4px 4px}
.li{display:flex;gap:9px;align-items:center;padding:6px;border-radius:8px;cursor:pointer}
.li:hover{background:var(--panel)}
.li.on{background:var(--acs)}
.li .nm{font-weight:600;font-size:13.5px}
.li .kw{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li>div:not(.av){min-width:0;flex:1}
.av{width:36px;height:36px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden;background:var(--c)}
.av img{width:100%;height:100%;object-fit:contain;background:#f3f6f9}
.av.big{width:120px;height:120px;border-radius:14px;font-size:40px}
.px{image-rendering:pixelated}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ov{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;border-top:4px solid var(--c)}
.ov:hover{box-shadow:var(--sh)}
.ov .av{margin-bottom:8px;width:56px;height:56px}
.kw-in{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:5px 7px;background:#fff}
.kw-in input{border:none;outline:none;flex:1;min-width:140px;padding:2px}
.kw-in:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.fld{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.fld .inp.fl{font-weight:600;background:var(--panel)}
.fld-tools{display:flex;gap:2px}
.ed-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.img-box{display:flex;flex-direction:column;gap:6px;align-items:center}
.cv-top{display:flex;gap:20px;align-items:flex-start;margin-bottom:20px}
.cv-name{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cv-sec{margin-top:20px}
.cv-sec h4{margin:0 0 8px;font-size:13px;color:var(--sub)}
.cv-recent{background:var(--acs);border-radius:10px;padding:12px 14px}
.cv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:16px}
.cv-f{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cv-f .lbl{margin-bottom:3px}
.bl{display:flex;flex-direction:column;gap:5px}
.bl-it{border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.bl-it:hover{border-color:var(--ac)}
.bl-it .mini{display:block}
.rel-li{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.view-bar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}

/* 나무위키 모드 */
.nm{max-width:900px}
.nm-title{font-size:28px;font-weight:800;border-bottom:1px solid var(--line2);padding-bottom:8px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.nm-title .mini{font-weight:400}
.nm-cat{border:1px solid var(--line2);padding:6px 10px;font-size:12.5px;margin-bottom:16px;background:#fafcfe}
.nm-cat b{margin-right:6px}
.nm-box{float:right;width:300px;margin:0 0 16px 22px;border-collapse:collapse;border:2px solid var(--c);font-size:13px;background:#fff}
.nm-box th,.nm-box td{border:1px solid var(--line);padding:6px 9px;vertical-align:top}
.nm-box th{background:color-mix(in srgb,var(--c) 14%,#fff);width:92px;text-align:center;font-weight:700}
.nm-box .nm-bh{background:var(--c);color:#fff;font-size:16px;padding:8px}
.nm-box .nm-img{text-align:center;background:#fafcfe;padding:10px}
.nm-box .nm-img img{max-width:100%;max-height:240px}
.nm-toc{display:inline-block;border:1px solid var(--line2);padding:10px 22px 10px 16px;margin:4px 0 10px;background:#fafcfe;min-width:200px;font-size:13px}
.nm-toc b{display:block;margin-bottom:4px}
.nm-toc a{display:block;color:var(--ac2);cursor:pointer;text-decoration:none}
.nm-toc a span{color:var(--text);margin-right:5px}
.nm-h{font-size:21px;border-bottom:1px solid var(--line2);padding-bottom:6px;margin:26px 0 10px;font-weight:700}
.nm-h span{color:var(--ac2);margin-right:8px}
.nm-bl{margin:0;padding-left:20px}
.nm-bl li{margin:3px 0}
.nm-bl a{color:var(--ac2);cursor:pointer}

/* 관계도 */
.rel{display:grid;grid-template-columns:250px 1fr;height:100%}
.rel-side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.rel-chars{display:flex;flex-wrap:wrap;gap:5px}
.rel-chars .chip{cursor:pointer;border:none;background:#fff;box-shadow:0 0 0 1px var(--line2) inset;color:var(--text)}
.rel-chars .chip:hover{box-shadow:0 0 0 1px var(--ac) inset}
.help{font-size:12px;color:var(--sub);line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.insp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.insp h4{margin:0 0 10px;font-size:13px}
.rel-canvas{position:relative;overflow:hidden;background:#fbfdfe}
#board{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#board.panning{cursor:grabbing}
.node{cursor:move}
.nd-bg{fill:#fff;stroke-width:2}
.node.sel .nd-bg{stroke-width:3.5}
.node:hover .nd-bg{filter:drop-shadow(0 3px 6px rgba(20,40,60,.15))}
.nd-name{font-size:13px;font-weight:700;fill:var(--text)}
.nd-ini{font-size:34px;font-weight:800}
.hdl{fill:#fff;stroke:var(--ac);stroke-width:2;cursor:crosshair;opacity:0}
.node:hover .hdl,.node.sel .hdl{opacity:1}
.hdl:hover{fill:var(--ac)}
.edge .ln{fill:none;stroke-width:2.2}
.edge .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge.sel .ln{stroke-width:3.5}
.lb-bg{fill:#fff;stroke-width:1.2}
.lb{font-size:12px;fill:var(--text);font-weight:600}
.tmp{stroke:var(--ac);stroke-width:2;stroke-dasharray:6 4}
.note{cursor:move}
.note rect{stroke:rgba(0,0,0,.08)}
.note.sel rect{stroke:var(--ac);stroke-width:2}
.note-t{font-size:12.5px;padding:10px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#4a4030;height:100%;overflow:hidden;font-family:inherit}
.zoom-ui{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:3px;box-shadow:var(--sh)}
.zoom-ui button{border:none;background:none;padding:2px 9px;border-radius:5px;color:var(--sub)}
.zoom-ui button:hover{background:var(--panel)}
.zoom-ui span{font-size:12px;color:var(--sub);align-self:center;min-width:42px;text-align:center}

/* 비중 */
.wg-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:14px}

.wg .act-h{border-bottom:2px solid var(--acs2);padding-bottom:2px}
.wg td.nm{font-size:13px;font-weight:600;padding-right:10px;white-space:nowrap}
.cell{width:17px;height:17px;border-radius:4px;background:#edf1f5}
.cell.l1{background:#cdeafb}.cell.l2{background:#93d1f3}.cell.l3{background:#4fb3ea}.cell.l4{background:#1d84c0}
.wg td.tot{padding-left:12px;font-size:12px;color:var(--sub);white-space:nowrap;min-width:180px}
.bar{height:8px;border-radius:4px;background:var(--acs);overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--ac)}
.wl{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--sub);margin-top:10px}
.wl .cell{width:13px;height:13px}

/* 복선 */
.fs-card{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:#fff}
.fs-card.st-done{border-left-color:var(--ok)}
.fs-card.st-drop{border-left-color:var(--faint);opacity:.75}
.fs-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fs-badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warns);color:#b86400;white-space:nowrap}
.st-done .fs-badge{background:var(--oks);color:var(--ok)}
.st-drop .fs-badge{background:#eef1f4;color:var(--sub)}
.fs-row{display:grid;grid-template-columns:auto 1fr auto auto 1fr;gap:8px;align-items:center;margin-top:8px}
.fs-row .lbl{margin:0}
.arrow{color:var(--faint)}
.fs-track{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 6px;margin-bottom:18px;background:#fff;overflow:auto}

/* 메모 */
.memo-add{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);margin-bottom:20px}
.memo-cols{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:start}
.mcol h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.memo{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:#fff;border-top:3px solid var(--mc)}
.memo.done{opacity:.55}
.memo-h{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.memo-h .sp{flex:1}
.memo textarea{border-color:transparent;background:#fafcfd}
.mgrp{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 6px;cursor:pointer}
.mgrp:hover{color:var(--ac2)}

@media (max-width:1000px){.pair{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.memo-cols{grid-template-columns:1fr}.pb-body{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="start" class="start">
  <div class="st-box">
    <div class="st-logo">전지적 <b>메롱</b> 시점</div>
    <div class="st-sub">게임 이야기를 위에서 내려다보는 설계 도구</div>
    <div class="st-btns">
      <button class="btn hidden" id="contBtn" data-act="cont">이어서 하기<small id="contInfo">브라우저에 남은 작업</small></button>
      <button class="btn pri" data-act="newProj">새롭게 시작하기</button>
      <button class="btn" data-act="loadFile">파일 불러오기</button>
    </div>
    <div class="st-note">작업 파일은 Story_YYMMDD_HHMM.json 이름으로 저장돼요.</div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <footer class="status" id="status"></footer>
</div>
<button class="unfold hidden" id="unfold" data-act="fold" title="사이드바 열기">»</button>
<div id="probs" class="probs hidden"></div>
<div id="modal" class="hidden"></div>
<div id="tip" class="tip hidden"></div>
<div id="toast" class="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>

<script>
"use strict";
/* ───────── 기본 도구 ───────── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unesc=s=>String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
const norm=s=>unesc(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const isNum=v=>typeof v==='number'&&isFinite(v);
const pad=n=>String(n).padStart(2,'0');
function stamp(){const d=new Date();return `${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`}
function hhmm(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}

const COLORS=['#4fb3ea','#f2789f','#8b7cf6','#3fbf8f','#f5a524','#ef6b5b','#5b8def','#9aa93c','#c07ad6','#5aa9a0'];
const EDGE_C=['#7f8c99','#4fb3ea','#f2789f','#3fbf8f','#f5a524','#8b7cf6'];
const NOTE_C=['#fff6c9','#e3f4fd','#fde4ec','#e6f6ee','#efe9fd'];
const MEMO_KINDS={'연출':'#8b7cf6','대사':'#4fb3ea','아이디어':'#f5a524','기타':'#9aa6b2'};
const ROLES=['주연','조연','단역','기타'];
const FIELD_SUGG=['나이','외형','성격','말투','목표','비밀','과거','좋아하는 것','싫어하는 것','성장'];
const INFO_SUGG=['타깃','플레이 방식','엔딩 수','세계관 한 줄','등급','개발 기간'];

let D=null; // 작업 데이터
const S={page:'info',sel:{story:null,char:null,term:null,event:null},edit:{char:false,term:false},
  storyAll:false,termQ:'',termCat:'',fsFilter:'all',wBy:'mention',memoKind:'연출',hideDone:false,
  probOpen:false,lastFile:null,lsErr:false,relSel:null,fold:false,flash:null};

function newData(){
  return {app:'전지적 메롱 시점',ver:1,
    info:{title:'',logline:'',synopsis:'',cover:'',
      fields:['장르','플랫폼','예상 플레이 시간','분위기·톤','주제','결말 방향','핵심 재미와 이야기의 연결','참고작'].map(label=>({label,value:''}))},
    timeline:{pre:'',suf:'년',unit:'year',compress:true,events:[]},
    story:{acts:[]},
    characters:[],
    termCats:['장소','단체','개념','설정','사물','사건'],terms:[],
    relations:{nodes:[],edges:[],notes:[],view:{x:60,y:40,z:1}},
    foreshadows:[],memos:[],
    ui:{mode:'normal'}};
}
function normalize(d){
  const b=newData();
  if(!d||typeof d!=='object') return b;
  for(const k in b){ if(d[k]===undefined) d[k]=b[k]; }
  for(const k of ['info','timeline','relations','ui']) for(const kk in b[k]) if(d[k][kk]===undefined) d[k][kk]=b[k][kk];
  d.story.acts=d.story.acts||[];
  d.story.acts.forEach(a=>{a.beats=a.beats||[];a.beats.forEach(be=>{be.scenes=be.scenes||[];be.date=be.date||{y:null,m:null,d:null}})});
  d.characters.forEach(c=>{c.keywords=c.keywords||[];c.fields=c.fields||[];if(c.weight===undefined)c.weight=true});
  d.terms.forEach(t=>{t.date=t.date||{y:null,m:null,d:null}});
  return d;
}

/* ───────── 저장 ───────── */
const LS='jmm_autosave_v1';
let saveT=null,stT=null,LI=null;
function touch(){
  LI=null;
  clearTimeout(saveT);saveT=setTimeout(autosave,700);
  clearTimeout(stT);stT=setTimeout(renderStatus,350);
}
function autosave(){
  if(!D) return;
  try{localStorage.setItem(LS,JSON.stringify(D));S.lsErr=false}catch(e){S.lsErr=true}
  renderStatus();
}
let DL=null;
try{ if(window.claude&&window.claude.use) window.claude.use('downloads').then(x=>{DL=x}).catch(()=>{}); }catch(e){}
async function saveFile(){
  const name='Story_'+stamp()+'.json';
  const json=JSON.stringify(D,null,1);
  if(DL){
    try{await DL.save({filename:name,data:json});S.lastFile=hhmm();toast(name+' 저장했어요');renderStatus();}
    catch(e){toast(e&&e.code==='declined'?'저장을 취소했어요':'저장하지 못했어요');}
    return;
  }
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    S.lastFile=hhmm();toast(name+' 저장했어요');renderStatus();
  }catch(e){toast('저장하지 못했어요')}
}
function loadFile(){
  const inp=$('#fileIn');inp.value='';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{const d=JSON.parse(r.result);D=normalize(d);resetSel();enterApp();autosave();toast(f.name+' 불러왔어요')}
      catch(e){modal({title:'불러오지 못했어요',msg:'이 도구에서 저장한 json 파일인지 확인해 주세요.',cancel:null})}
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetSel(){S.sel={story:null,char:null,term:null,event:null};S.edit={char:false,term:false};S.page='info';S.relSel=null;S.storyAll=false}

/* ───────── 모달·알림 ───────── */
function modal({title,msg='',input=null,area=false,ok='확인',cancel='취소',danger=false,ph=''}){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="md-bg"><div class="md"><div class="md-t">${esc(title)}</div>${msg?`<div class="md-m">${msg}</div>`:''}
      ${input!==null?(area?`<textarea class="inp" id="mdIn" rows="4" placeholder="${esc(ph)}">${esc(input)}</textarea>`:`<input class="inp" id="mdIn" value="${esc(input)}" placeholder="${esc(ph)}">`):''}
      <div class="md-b">${cancel?`<button class="btn" id="mdNo">${cancel}</button>`:''}<button class="btn ${danger?'dangerf':'pri'}" id="mdOk">${ok}</button></div></div></div>`;
    m.classList.remove('hidden');
    const inp=$('#mdIn');
    if(inp){inp.focus();inp.select&&inp.select()}else $('#mdOk').focus();
    const done=v=>{m.classList.add('hidden');m.innerHTML='';res(v)};
    $('#mdOk').onclick=()=>done(input!==null?inp.value:true);
    if($('#mdNo')) $('#mdNo').onclick=()=>done(input!==null?null:false);
    $('.md-bg',m).addEventListener('mousedown',e=>{if(e.target.classList.contains('md-bg'))done(input!==null?null:false)});
    m.onkeydown=e=>{
      if(e.key==='Escape')done(input!==null?null:false);
      if(e.key==='Enter'&&(!area||e.ctrlKey||e.metaKey)){e.preventDefault();done(input!==null?inp.value:true)}
    };
  });
}
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}

function pickImage(cb){
  const inp=$('#imgIn');inp.value='';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const w=img.naturalWidth,h=img.naturalHeight,pixel=Math.max(w,h)<=200,MAX=512;
        if(Math.max(w,h)>MAX){
          const s=MAX/Math.max(w,h),c=document.createElement('canvas');
          c.width=Math.round(w*s);c.height=Math.round(h*s);
          const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);
          cb({data:c.toDataURL('image/png'),pixel});
        }else cb({data:r.result,pixel});
      };
      img.onerror=()=>toast('이미지를 읽지 못했어요');
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

/* ───────── 데이터 조회 ───────── */
const charById=id=>D.characters.find(c=>c.id===id);
const termById=id=>D.terms.find(t=>t.id===id);
const fsById=id=>D.foreshadows.find(f=>f.id===id);
const fsByName=n=>D.foreshadows.find(f=>norm(f.name)===norm(n));
const isNamu=()=>D&&D.ui.mode==='namu';
function namesOf(o){return [o.name,...String(o.aliases||'').split(',')].map(s=>(s||'').trim()).filter(Boolean)}
function li(){
  if(LI) return LI;
  const m=new Map();
  D.characters.forEach(c=>namesOf(c).forEach(n=>{const k=norm(n);if(!m.has(k))m.set(k,{k:'char',o:c})}));
  D.terms.forEach(t=>namesOf(t).forEach(n=>{const k=norm(n);if(!m.has(k))m.set(k,{k:'term',o:t})}));
  return LI=m;
}
function storyFlat(){
  const out=[];
  D.story.acts.forEach((a,i)=>{
    const n1=`${i+1}`;
    out.push({id:a.id,type:'act',node:a,num:n1,label:`${n1}. ${a.title||'(제목 없음)'}`});
    a.beats.forEach((b,j)=>{
      const n2=`${n1}-${j+1}`;
      out.push({id:b.id,type:'beat',node:b,act:a,num:n2,label:`${n2}. ${b.title||'(제목 없음)'}`});
      b.scenes.forEach((s,k)=>{
        const n3=`${n2}-${k+1}`;
        out.push({id:s.id,type:'scene',node:s,act:a,beat:b,num:n3,label:`${n3}. ${s.title||'(제목 없음)'}`});
      });
    });
  });
  return out;
}
const findStory=id=>id?storyFlat().find(x=>x.id===id):null;
function storyOptions(sel,empty='— 위치 미정 —'){
  return `<option value="">${empty}</option>`+storyFlat().map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${'　'.repeat(x.type==='act'?0:x.type==='beat'?1:2)}${esc(x.label)}</option>`).join('');
}
function storyListOf(id){
  for(const a of D.story.acts){
    if(a.id===id) return D.story.acts;
    for(const b of a.beats){
      if(b.id===id) return a.beats;
      for(const s of b.scenes) if(s.id===id) return b.scenes;
    }
  }
  return null;
}

function beatFullText(b){return (b.title||'')+'\n'+(b.summary||'')+'\n'+b.scenes.map(s=>(s.title||'')+'\n'+(s.content||'')).join('\n')}
function fmtY(y){const t=D.timeline;return `${t.pre||''}${y}${t.suf||''}`}
function fmtDate(d){if(!d||!isNum(d.y))return '';return fmtY(d.y)+(isNum(d.m)?` ${d.m}월`:'')+(isNum(d.d)?` ${d.d}일`:'')}

// [[이름]] 또는 [[이름|보일 글]] : 링크, ??내용?? : 미정, {{복선 이름}} : 복선
const RE_LINK=/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g;
const RE_UNDEC=/\?\?([\s\S]+?)\?\?/g;
const RE_FS=/\{\{([^{}]+?)\}\}/g;
function rich(text,ctx){
  if(!text) return '';
  let h=esc(text);
  h=h.replace(RE_UNDEC,(m,a)=>`<span class="undec" title="미정 — 아직 정하지 않은 부분">${a}</span>`);
  h=h.replace(RE_LINK,(m,t,d)=>linkHtml(t,d,ctx));
  h=h.replace(RE_FS,(m,n)=>fsHtml(n,ctx));
  return h.replace(/\n/g,'<br>');
}
function linkHtml(t,d,ctx){
  const r=li().get(norm(t)),disp=d||t;
  if(!r) return `<a class="lk broken" data-act="newTerm" data-name="${t}" title="없는 항목 — 눌러서 용어 사전에 만들기">${disp}</a>`;
  if(r.k==='char') return `<a class="lk char" style="--c:${r.o.color}" data-go="char:${r.o.id}" data-tip="char:${r.o.id}">${disp}</a>`;
  if(isNamu()&&ctx){
    let i=ctx.notes.indexOf(r.o);if(i<0){ctx.notes.push(r.o);i=ctx.notes.length-1}
    return `<a class="lk term" data-go="term:${r.o.id}">${disp}</a><sup class="fn" data-tip="term:${r.o.id}">[${i+1}]</sup>`;
  }
  return `<a class="lk term" data-go="term:${r.o.id}" data-tip="term:${r.o.id}">${disp}</a>`;
}
function fsHtml(n,ctx){
  const f=fsByName(n);
  if(!f) return `<span class="fsx miss" data-act="newFs" data-name="${n}" ${ctx&&ctx.node?`data-node="${ctx.node}"`:''} title="없는 복선 — 눌러서 복선 목록에 만들기">◆ ${n}</span>`;
  const st=fsState(f);
  return `<span class="fsx ${st==='done'?'done':st==='drop'?'drop':''}" data-go="fs:${f.id}" title="복선: ${esc(f.name)} — ${FS_LABEL[st]}">◆ ${n}</span>`;
}
function foot(ctx){
  if(!ctx||!ctx.notes.length) return '';
  return `<div class="footnotes">${ctx.notes.map((t,i)=>`<div><b>[${i+1}]</b> <a data-go="term:${t.id}">${esc(t.name)}</a> — ${esc(t.short||'(한 줄 설명 없음)')}</div>`).join('')}</div>`;
}
function dialogue(text,ctx){
  if(!text) return '';
  const byName=new Map();D.characters.forEach(c=>namesOf(c).forEach(n=>byName.set(norm(n),c)));
  return text.split('\n').map(l=>{
    if(!l.trim()) return '<div class="dl-gap"></div>';
    const m=l.match(/^\s*([^:：\n]{1,24}?)\s*[:：]\s?(.*)$/);
    if(m&&!/^https?$/i.test(m[1])){
      const c=byName.get(norm(m[1]));
      return `<div class="dl-line"><span class="dl-sp" style="--c:${c?c.color:'#7a8896'}">${esc(m[1].trim())}</span><span>${rich(m[2],ctx)}</span></div>`;
    }
    return `<div class="dl-dir">${rich(l,ctx)}</div>`;
  }).join('');
}
function body(text,mode,node){
  const ctx={notes:[],node};
  const h=mode==='dialogue'?dialogue(text,ctx):rich(text,ctx);
  return (h||'<span class="ph-t">아직 비어 있어요</span>')+foot(ctx);
}
function editor(bind,value,{mode='novel',rows=6,node='',stack=false,ph=''}={}){

/* ───────── 확인할 것(미정·복선·없는 링크) ───────── */
function collectTexts(){
  const T=[],add=(text,go,label)=>{if(text)T.push({text:String(text),go,label})};
  add(D.info.logline,'page:info','기본 정보 · 한 줄 요약');add(D.info.synopsis,'page:info','기본 정보 · 시놉시스');
  D.info.fields.forEach(f=>add(f.value,'page:info','기본 정보 · '+f.label));
  storyFlat().forEach(x=>add(x.type==='scene'?x.node.content:x.node.summary,'node:'+x.id,'스토리 · '+x.label));
  D.characters.forEach(c=>{add(c.recent,'char:'+c.id,`캐릭터 · ${c.name} · 근황`);c.fields.forEach(f=>add(f.value,'char:'+c.id,`캐릭터 · ${c.name} · ${f.label}`))});
  D.terms.forEach(t=>{add(t.short,'term:'+t.id,`용어 · ${t.name} · 한 줄 설명`);add(t.body,'term:'+t.id,`용어 · ${t.name}`)});
  D.timeline.events.forEach(e=>add(e.desc,'event:'+e.id,`연표 · ${e.title}`));
  D.foreshadows.forEach(f=>add(f.desc,'fs:'+f.id,`복선 · ${f.name}`));
  D.memos.forEach(m=>add(m.text,'memo:'+m.id,`메모 · ${m.kind}`));
  D.relations.notes.forEach(n=>add(n.text,'page:rel','관계도 · 메모'));
  return T;
}
const FS_LABEL={open:'미회수',done:'회수됨',drop:'회수 안 함'};
function fsState(f){return f.dropped?'drop':f.payoff?'done':'open'}
function problems(){
  const P={undec:[],fs:[],broken:[]},L=li();
  collectTexts().forEach(t=>{
    for(const m of t.text.matchAll(RE_UNDEC)) P.undec.push({go:t.go,label:t.label,text:m[1]});
    for(const m of t.text.matchAll(RE_LINK)) if(!L.get(norm(m[1]))) P.broken.push({go:t.go,label:t.label,text:'[['+m[1]+']] — 용어 사전·캐릭터에 없음'});
    for(const m of t.text.matchAll(RE_FS)) if(!fsByName(m[1])) P.broken.push({go:t.go,label:t.label,text:'{{'+m[1]+'}} — 복선 목록에 없음'});
  });
  const flag='항목 전체를 미정으로 표시함';
  storyFlat().forEach(x=>x.node.undec&&P.undec.push({go:'node:'+x.id,label:'스토리 · '+x.label,text:flag}));
  D.characters.forEach(c=>c.undec&&P.undec.push({go:'char:'+c.id,label:'캐릭터 · '+c.name,text:flag}));
  D.terms.forEach(t=>t.undec&&P.undec.push({go:'term:'+t.id,label:'용어 · '+t.name,text:flag}));
  D.timeline.events.forEach(e=>e.undec&&P.undec.push({go:'event:'+e.id,label:'연표 · '+e.title,text:flag}));
  D.characters.forEach(c=>{if(!c.keywords.length)P.undec.push({go:'char:'+c.id,label:'캐릭터 · '+c.name,text:'키워드(필수)가 비어 있음'})});
  D.foreshadows.forEach(f=>{if(fsState(f)==='open'){const p=findStory(f.plant);P.fs.push({go:'fs:'+f.id,label:'복선 · '+(f.name||'(이름 없음)'),text:p?'심은 곳: '+p.label:'심은 곳도 아직 정하지 않음'})}});
  return P;
}
const PAGE_OF={node:'story',char:'chars',term:'terms',event:'timeline',fs:'fs',memo:'memo'};
function pageOfGo(g){const [k,id]=g.split(':');return k==='page'?id:PAGE_OF[k]}
function hasUndec(...texts){return texts.some(t=>t&&/\?\?[\s\S]+?\?\?/.test(t))}

function go(spec){
  const [k,id]=spec.split(':');
  if(k==='term'){S.page='terms';S.sel.term=id;S.edit.term=false}
  else if(k==='char'){S.page='chars';S.sel.char=id;S.edit.char=false}
  else if(k==='node'){S.page='story';S.sel.story=id;S.storyAll=false}
  else if(k==='event'){S.page='timeline';S.sel.event=id}
  else if(k==='fs'){S.page='fs';S.fsFilter='all';S.flash=id}
  else if(k==='memo'){S.page='memo';S.hideDone=false;S.flash=id}
  else if(k==='page'){S.page=id}
  S.probOpen=false;render();
  $('#main').scrollTop=0;const ed=$('.ed');if(ed)ed.scrollTop=0;
  if(S.flash){const f=S.flash;S.flash=null;setTimeout(()=>{const el=$(`[data-flash="${f}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}},40)}
}

/* ── 연표 ── */
function tlItems(){
  const it=[];
  D.timeline.events.forEach(e=>{if(isNum(e.y))it.push({k:'event',id:e.id,y:e.y,m:e.m,d:e.d,lane:(e.lane||'').trim()||'사건',title:e.title||'(제목 없음)',undec:e.undec||hasUndec(e.desc)})});
  storyFlat().forEach(x=>{if(x.type==='beat'&&x.node.date&&isNum(x.node.date.y))it.push({k:'node',id:x.id,y:x.node.date.y,m:x.node.date.m,d:x.node.date.d,lane:'스토리 (2차 틀)',title:x.label,undec:x.node.undec})});
  D.terms.forEach(t=>{if(t.onTl&&t.date&&isNum(t.date.y))it.push({k:'term',id:t.id,y:t.date.y,m:t.date.m,d:t.date.d,lane:'용어 사전',title:t.name,undec:t.undec})});
  return it;
}
function tlBoard(){
  const tl=D.timeline,items=tlItems(),undated=D.timeline.events.filter(e=>!isNum(e.y));
  if(!items.length&&!undated.length) return empty('아직 연표가 비어 있어요.<br>“+ 사건 추가”로 첫 사건을 넣거나, 스토리 2차 틀·용어에 날짜를 넣으면 여기에 나타나요.');
  const month=tl.unit==='month';
  const key=i=>month?i.y*13+(isNum(i.m)?i.m:0):i.y;
  const mi=k=>{const y=Math.floor(k/13),m=k-y*13;return y*12+Math.max(m,1)-1};
  const labelOf=k=>{if(!month)return fmtY(k);const y=Math.floor(k/13),m=k-y*13;return fmtY(y)+(m?` ${m}월`:' (월 미정)')};
  const used=[...new Set(items.map(key))].sort((a,b)=>a-b);
  let keys=used,compress=tl.compress,note='';
  if(!compress&&used.length){
    const all=[];
    if(!month){for(let y=used[0];y<=used.at(-1)&&all.length<=400;y++)all.push(y)}
    else{
      const y0=Math.floor(used[0]/13),y1=Math.floor(used.at(-1)/13);
      for(let y=y0;y<=y1&&all.length<=400;y++){if(used.includes(y*13))all.push(y*13);for(let m=1;m<=12;m++){const k=y*13+m;if(k>=used[0]&&k<=used.at(-1))all.push(k)}}
    }
    if(all.length>400){compress=true;note='<div class="mini" style="margin:6px 0">기간이 너무 길어서 빈 기간을 자동으로 접었어요.</div>'}
    else keys=all;
  }
  const cols=[];
  keys.forEach((k,i)=>{
    if(i>0&&compress){
      const gap=month?mi(k)-mi(keys[i-1])-1:k-keys[i-1]-1;
      if(gap>0)cols.push({gap:true,label:month?`${gap}개월`:`${gap}${tl.suf||'년'}`});
    }
    cols.push({k,label:labelOf(k)});
  });
  const laneOrder=['스토리 (2차 틀)','사건'];
  const lanes=[...new Set(items.map(i=>i.lane))].sort((a,b)=>{
    const ia=laneOrder.indexOf(a),ib=laneOrder.indexOf(b),la=a==='용어 사전'?99:ia<0?50:ia,lb=b==='용어 사전'?99:ib<0?50:ib;
    return la-lb||a.localeCompare(b);
  });
  const dTxt=i=>month?(isNum(i.d)?`${i.d}일`:''):(isNum(i.m)?`${i.m}월${isNum(i.d)?' '+i.d+'일':''}`:'');
  const card=i=>`<div class="tl-it k-${i.k} ${i.undec?'is-undec':''} ${i.k==='event'&&S.sel.event===i.id?'sel':''}" data-act="tlOpen" data-k="${i.k}" data-id="${i.id}">${dTxt(i)?`<span class="tl-d">${dTxt(i)}</span>`:''}${esc(i.title)}</div>`;
  let h=`<div class="tl" style="grid-template-columns:140px ${cols.map(c=>c.gap?'34px':'200px').join(' ')}">`;
  h+=`<div class="tl-hd tl-corner"></div>`+cols.map(c=>c.gap?`<div class="tl-hd tl-gap">⋯ ${c.label} ⋯</div>`:`<div class="tl-hd">${esc(c.label)}</div>`).join('');
  lanes.forEach(ln=>{
    h+=`<div class="tl-ln">${esc(ln)}</div>`;
    cols.forEach(c=>{
      if(c.gap){h+=`<div class="tl-gap"></div>`;return}
      const cell=items.filter(i=>i.lane===ln&&key(i)===c.k).sort((a,b)=>(a.m||0)-(b.m||0)||(a.d||0)-(b.d||0));
      h+=`<div class="tl-cell">${cell.map(card).join('')}</div>`;
    });
  });
  h+='</div>';
  return `${note}<div class="tl-wrap">${items.length?h:'<div class="empty" style="border:none">날짜가 정해진 항목이 아직 없어요.</div>'}</div>
    <div class="tl-legend"><span><i style="background:#4fb3ea"></i>사건</span><span><i style="background:#8b7cf6"></i>스토리 2차 틀</span><span><i style="background:#3fbf8f"></i>용어 사전</span><span><span class="undec">물결 밑줄</span> 미정 포함</span></div>

function relOf(cid){
  const R=D.relations,out=[];
  R.edges.forEach(e=>{
    const a=R.nodes.find(n=>n.id===e.from),b=R.nodes.find(n=>n.id===e.to);if(!a||!b)return;
    if(a.charId===cid)out.push({dir:e.both?'↔':'→',o:charById(b.charId),label:e.label});
    else if(b.charId===cid)out.push({dir:e.both?'↔':'←',o:charById(a.charId),label:e.label});
  });
  return out.filter(r=>r.o);
}
function backlinks(id){
  const L=li(),out=[],seen=new Set();
  collectTexts().forEach(t=>{
    if(t.go==='term:'+id||t.go==='char:'+id) return;
    for(const m of t.text.matchAll(RE_LINK)){
      const r=L.get(norm(m[1]));
      if(r&&r.o.id===id){
        const k=t.go+'|'+t.label;
        if(!seen.has(k)){seen.add(k);const i=m.index;out.push({...t,snip:(i>24?'…':'')+t.text.slice(Math.max(0,i-24),i+50).replace(/\n/g,' ')})}
        break;
      }
    }
  });
  return out;
}

const NW=112,NH=138;
let drag=null,lastTap={id:null,t:0};

function relInsp(){
  const R=D.relations,s=S.relSel;
  if(!s) return '';
  if(s.k==='edge'){
    const e=R.edges.find(x=>x.id===s.id);if(!e)return '';
    const a=charById((R.nodes.find(n=>n.id===e.from)||{}).charId),b=charById((R.nodes.find(n=>n.id===e.to)||{}).charId);
    return `<div class="insp"><h4>화살표 · ${esc(a?a.name:'?')} ${e.both?'↔':'→'} ${esc(b?b.name:'?')}</h4>
      <div class="field"><label>관계</label><input class="inp" id="edgeLabel" data-bind="edge|${e.id}|label" data-rr="board" value="${esc(e.label||'')}" placeholder="예: 짝사랑, 라이벌, 소꿉친구"></div>
      <div class="field"><label>색</label>${swatches(EDGE_C,e.color,'edgeColor',e.id)}</div>
      <div class="row"><label class="chk"><input type="checkbox" data-bind="edge|${e.id}|both" data-rr="board" ${e.both?'checked':''}> 양방향</label><button class="btn sm" data-act="edgeFlip" data-id="${e.id}">방향 바꾸기</button><button class="btn sm danger" data-act="edgeDel" data-id="${e.id}">지우기</button></div></div>`;
  }
  if(s.k==='note'){
    const n=R.notes.find(x=>x.id===s.id);if(!n)return '';
    return `<div class="insp"><h4>메모</h4><textarea class="inp" id="noteText" rows="4" data-bind="note|${n.id}|text" data-rr="board">${esc(n.text||'')}</textarea>
      <div class="field" style="margin-top:8px"><label>색</label>${swatches(NOTE_C,n.color,'noteColor',n.id)}</div>
      <button class="btn sm danger" data-act="noteDel" data-id="${n.id}">메모 지우기</button></div>`;
  }
  if(s.k==='node'){
    const n=R.nodes.find(x=>x.id===s.id),c=n&&charById(n.charId);if(!c)return '';
    return `<div class="insp"><h4>${esc(c.name)}</h4><div class="row"><button class="btn sm" data-go="char:${c.id}">프로필 열기</button><button class="btn sm danger" data-act="nodeRemove" data-id="${n.id}">보드에서 빼기</button></div></div>`;
  }
  return '';
}
function refreshInsp(){const el=$('#relInsp');if(el)el.innerHTML=relInsp()}
function clipRect(c,to){
  const dx=to.x-c.x,dy=to.y-c.y;
  if(!dx&&!dy) return c;
  const t=Math.min((NW/2+4)/Math.abs(dx||1e-9),(NH/2+4)/Math.abs(dy||1e-9));
  return {x:c.x+dx*t,y:c.y+dy*t};
}
function drawBoard(){
  const w=$('#world');if(!w)return;
  const R=D.relations,v=R.view,sel=S.relSel||{};
  w.setAttribute('transform',`translate(${v.x},${v.y}) scale(${v.z})`);
  $('#gridPat').setAttribute('patternTransform',`translate(${v.x},${v.y}) scale(${v.z})`);
  const zt=$('#zoomTxt');if(zt)zt.textContent=Math.round(v.z*100)+'%';
  let h='';
  R.notes.forEach(n=>{
    const nw=n.w||170,nh=n.h||110;
    h+=`<g class="note ${sel.k==='note'&&sel.id===n.id?'sel':''}" data-note="${n.id}" transform="translate(${n.x},${n.y})"><rect width="${nw}" height="${nh}" rx="6" fill="${n.color||NOTE_C[0]}"/><foreignObject width="${nw}" height="${nh}"><div xmlns="http://www.w3.org/1999/xhtml" class="note-t">${esc(n.text||'메모')}</div></foreignObject></g>`;
  });
  const nodeOf=id=>R.nodes.find(n=>n.id===id);
  R.edges.forEach(e=>{
    const a=nodeOf(e.from),b=nodeOf(e.to);if(!a||!b)return;
    const ca={x:a.x+NW/2,y:a.y+NH/2},cb={x:b.x+NW/2,y:b.y+NH/2};
    const rev=R.edges.some(o=>o!==e&&o.from===e.to&&o.to===e.from);
    const dx=cb.x-ca.x,dy=cb.y-ca.y,len=Math.hypot(dx,dy)||1,off=rev?30:0;
    const cp={x:(ca.x+cb.x)/2+(-dy/len)*off,y:(ca.y+cb.y)/2+(dx/len)*off};
    const p0=clipRect(ca,cp),p1=clipRect(cb,cp);
    const ci=Math.max(0,EDGE_C.indexOf(e.color)),col=EDGE_C[ci];
    const d=`M${p0.x},${p0.y} Q${cp.x},${cp.y} ${p1.x},${p1.y}`;
    const mx=.25*p0.x+.5*cp.x+.25*p1.x,my=.25*p0.y+.5*cp.y+.25*p1.y;
    const tw=[...(e.label||'')].reduce((s,ch)=>s+(ch.charCodeAt(0)>255?12.5:7),0)+18;
    h+=`<g class="edge ${sel.k==='edge'&&sel.id===e.id?'sel':''}" data-edge="${e.id}"><path d="${d}" class="hit"/><path d="${d}" class="ln" stroke="${col}" marker-end="url(#ae${ci})" ${e.both?`marker-start="url(#as${ci})"`:''}/>
      ${e.label?`<g transform="translate(${mx},${my})"><rect x="${-tw/2}" y="-11" width="${tw}" height="22" rx="11" class="lb-bg" stroke="${col}"/><text class="lb" text-anchor="middle" dy="4">${esc(e.label)}</text></g>`:''}</g>`;
  });
  R.nodes.forEach(n=>{
    const c=charById(n.charId);if(!c)return;
    const iw=NW-16;
    h+=`<g class="node ${sel.k==='node'&&sel.id===n.id?'sel':''}" data-node="${n.id}" transform="translate(${n.x},${n.y})">
      <rect width="${NW}" height="${NH}" rx="12" class="nd-bg" style="stroke:${c.color}"/>
      ${c.image?`<clipPath id="cp${n.id}"><rect x="8" y="8" width="${iw}" height="${iw}" rx="8"/></clipPath><rect x="8" y="8" width="${iw}" height="${iw}" rx="8" fill="#f3f6f9"/><image href="${c.image}" x="8" y="8" width="${iw}" height="${iw}" clip-path="url(#cp${n.id})" preserveAspectRatio="xMidYMid meet" ${c.pixel?'style="image-rendering:pixelated"':''}/>`
        :`<rect x="8" y="8" width="${iw}" height="${iw}" rx="8" fill="${c.color}" opacity=".14"/><text x="${NW/2}" y="${8+iw/2+12}" text-anchor="middle" class="nd-ini" fill="${c.color}">${esc((c.name||'?').slice(0,1))}</text>`}
      <text x="${NW/2}" y="${NH-11}" text-anchor="middle" class="nd-name">${esc(c.name||'(이름 없음)')}</text>
      <circle class="hdl" data-hdl="${n.id}" cx="${NW}" cy="${NH/2}" r="8"/></g>`;
  });
  if(drag&&drag.type==='link'){
    const a=nodeOf(drag.from);
    if(a) h+=`<line class="tmp" x1="${a.x+NW}" y1="${a.y+NH/2}" x2="${drag.x}" y2="${drag.y}"/>`;
  }
  w.innerHTML=h;
}
function initBoard(){
  const svg=$('#board');if(!svg)return;
  drawBoard();
  svg.addEventListener('pointerdown',bdDown);
  svg.addEventListener('pointermove',bdMove);
  svg.addEventListener('pointerup',bdUp);
  svg.addEventListener('pointercancel',bdUp);
  svg.addEventListener('wheel',bdWheel,{passive:false});
}
function toWorld(ev){const r=$('#board').getBoundingClientRect(),v=D.relations.view;return {x:(ev.clientX-r.left-v.x)/v.z,y:(ev.clientY-r.top-v.y)/v.z}}
function bdDown(ev){
  if(ev.button!==0)return;
  const t=ev.target,svg=$('#board'),R=D.relations,p=toWorld(ev),now=Date.now();
  try{svg.setPointerCapture(ev.pointerId)}catch(e){}
  const hd=t.closest('[data-hdl]'),nd=t.closest('[data-node]'),nt=t.closest('[data-note]'),ed=t.closest('[data-edge]');
  if(hd){drag={type:'link',from:hd.dataset.hdl,x:p.x,y:p.y}}
  else if(nd){
    const n=R.nodes.find(x=>x.id===nd.dataset.node);
    if(lastTap.id===n.id&&now-lastTap.t<380){lastTap={id:null,t:0};drag=null;go('char:'+n.charId);return}
    lastTap={id:n.id,t:now};
    drag={type:'node',o:n,dx:p.x-n.x,dy:p.y-n.y};S.relSel={k:'node',id:n.id};
  }
  else if(nt){const n=R.notes.find(x=>x.id===nt.dataset.note);drag={type:'note',o:n,dx:p.x-n.x,dy:p.y-n.y};S.relSel={k:'note',id:n.id};lastTap={id:null,t:0}}
  else if(ed){S.relSel={k:'edge',id:ed.dataset.edge};drag=null;lastTap={id:null,t:0}}
  else{
    if(lastTap.id==='bg'&&now-lastTap.t<380){lastTap={id:null,t:0};addNote(p.x-85,p.y-55);return}
    lastTap={id:'bg',t:now};
    drag={type:'pan',sx:ev.clientX,sy:ev.clientY,vx:R.view.x,vy:R.view.y};S.relSel=null;svg.classList.add('panning');
  }
  drawBoard();refreshInsp();
  if(S.relSel&&S.relSel.k==='edge')setTimeout(()=>{const el=$('#edgeLabel');if(el&&!el.value)el.focus()},0);
}
function bdMove(ev){
  if(!drag)return;
  const p=toWorld(ev),v=D.relations.view;
  if(drag.type==='node'||drag.type==='note'){drag.o.x=p.x-drag.dx;drag.o.y=p.y-drag.dy;drag.moved=true}
  else if(drag.type==='pan'){v.x=drag.vx+(ev.clientX-drag.sx);v.y=drag.vy+(ev.clientY-drag.sy);drag.moved=true}
  else if(drag.type==='link'){drag.x=p.x;drag.y=p.y}
  drawBoard();
}
function bdUp(ev){
  if(!drag)return;
  const R=D.relations;
  if(drag.type==='link'){
    const p=toWorld(ev);
    const tgt=R.nodes.find(n=>n.id!==drag.from&&p.x>=n.x&&p.x<=n.x+NW&&p.y>=n.y&&p.y<=n.y+NH);
    if(tgt&&!R.edges.some(e=>e.from===drag.from&&e.to===tgt.id)){
      const e={id:uid(),from:drag.from,to:tgt.id,label:'',color:EDGE_C[0],both:false};
      R.edges.push(e);S.relSel={k:'edge',id:e.id};
      drag=null;touch();drawBoard();refreshInsp();setTimeout(()=>{const el=$('#edgeLabel');if(el)el.focus()},0);return;
    }
  }
  if((drag.type==='node'||drag.type==='note')&&drag.moved){drag.o.x=Math.round(drag.o.x/12)*12;drag.o.y=Math.round(drag.o.y/12)*12}
  if(drag.moved||drag.type==='link')touch();
  drag=null;$('#board').classList.remove('panning');drawBoard();
}
function zoomAt(f,cx,cy){
  const v=D.relations.view,z2=Math.min(2.5,Math.max(.3,v.z*f));
  v.x=cx-(cx-v.x)*(z2/v.z);v.y=cy-(cy-v.y)*(z2/v.z);v.z=z2;drawBoard();touch();
}
function bdWheel(ev){
  ev.preventDefault();
  const r=$('#board').getBoundingClientRect();
  zoomAt(ev.deltaY<0?1.1:1/1.1,ev.clientX-r.left,ev.clientY-r.top);
}
function addNote(x,y){
  const n={id:uid(),x:Math.round(x),y:Math.round(y),w:170,h:110,text:'',color:NOTE_C[0]};
  D.relations.notes.push(n);S.relSel={k:'note',id:n.id};touch();drawBoard();refreshInsp();
  setTimeout(()=>{const el=$('#noteText');if(el)el.focus()},0);
}
function freeSpot(){
  const R=D.relations,i=R.nodes.length;
  return {x:40+(i%5)*168,y:40+Math.floor(i/5)*196};
}
function relFit(){
  const R=D.relations,svg=$('#board');if(!svg)return;
  const bx=[...R.nodes.map(n=>[n.x,n.y,n.x+NW,n.y+NH]),...R.notes.map(n=>[n.x,n.y,n.x+(n.w||170),n.y+(n.h||110)])];
  if(!bx.length){R.view={x:60,y:40,z:1};drawBoard();return}
  const x0=Math.min(...bx.map(b=>b[0])),y0=Math.min(...bx.map(b=>b[1])),x1=Math.max(...bx.map(b=>b[2])),y1=Math.max(...bx.map(b=>b[3]));
  const r=svg.getBoundingClientRect(),z=Math.min(1.4,Math.max(.3,Math.min((r.width-80)/(x1-x0),(r.height-80)/(y1-y0))));
  R.view={z,x:(r.width-(x1-x0)*z)/2-x0*z,y:(r.height-(y1-y0)*z)/2-y0*z};drawBoard();touch();
}

/* ── 비중 ── */
function countMentions(c,text){
  if(!text)return 0;
  let t=text,n=0;
  namesOf(c).sort((a,b)=>b.length-a.length).forEach(s=>{const parts=t.split(s);n+=parts.length-1;t=parts.join('\u0000')});
  return n;
}
function countLines(c,scenes){
  const ns=new Set(namesOf(c).map(norm));let n=0;
  scenes.forEach(s=>{if(s.mode!=='dialogue')return;(s.content||'').split('\n').forEach(l=>{const m=l.match(/^\s*([^:：\n]{1,24}?)\s*[:：]/);if(m&&ns.has(norm(m[1])))n++})});
  return n;
}

/* ───────── 입력 연결 ───────── */
function bindTarget(k,id){
  switch(k){
    case 'info':return D.info;
    case 'tl':return D.timeline;
    case 'node':{const x=findStory(id);return x&&x.node}
    case 'char':return charById(id);
    case 'term':return termById(id);
    case 'event':return D.timeline.events.find(e=>e.id===id);
    case 'fs':return fsById(id);
    case 'memo':return D.memos.find(m=>m.id===id);
    case 'edge':return D.relations.edges.find(e=>e.id===id);
    case 'note':return D.relations.notes.find(n=>n.id===id);
  }
}
function setBind(spec,val){
  const [k,id,path]=spec.split('|'),o=bindTarget(k,id);if(!o)return;
  const ks=path.split('.');let cur=o;
  for(let i=0;i<ks.length-1;i++){if(cur[ks[i]]==null||typeof cur[ks[i]]!=='object')cur[ks[i]]={};cur=cur[ks[i]]}
  cur[ks.at(-1)]=val;
}
function readVal(el){
  if(el.type==='checkbox')return el.checked;
  if(el.dataset.num!==undefined){if(el.value==='')return null;const n=Number(el.value);return isFinite(n)?n:null}
  return el.value;
}
const REG={
  tlBoard:()=>{const b=$('#tlBoard');if(b)b.innerHTML=tlBoard()},
  tree:()=>{const b=$('.tree-b');if(b)b.innerHTML=treeHtml()},
  board:()=>drawBoard(),
  termList:()=>{const b=$('#termList');if(b)b.innerHTML=termListHtml()},
  charList:()=>{const b=$('#charList');if(b)b.innerHTML=charListHtml()},
  side:()=>renderSide(),
};
const regT={};
function refreshRegion(name){clearTimeout(regT[name]);regT[name]=setTimeout(()=>{LI=null;REG[name]&&REG[name]()},120)}
const pvT={};
function afterBind(el,isChange){
  touch();
  if(el.dataset.pv){
    const id=el.dataset.pv;clearTimeout(pvT[id]);
    pvT[id]=setTimeout(()=>{LI=null;const p=$('#'+id);if(p)p.innerHTML=body(el.value,el.dataset.mode,el.dataset.node)},120);
  }
  if(el.dataset.rr)refreshRegion(el.dataset.rr);
  if(el.dataset.bind&&el.dataset.bind.endsWith('|content')){const c=$('#sceneCnt');if(c)c.textContent=el.value.length.toLocaleString()}
  if(el.dataset.bind&&el.dataset.bind.startsWith('node|'))refreshRegion('tree');
  if(isChange&&el.dataset.full!==undefined)render();
}
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.auto!==undefined)autoH(el);
  if(el.id==='termSearch'){S.termQ=el.value;refreshRegion('termList');return}
  if(!el.dataset||!el.dataset.bind||el.type==='checkbox'||el.tagName==='SELECT')return;
  setBind(el.dataset.bind,readVal(el));afterBind(el,false);
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.change){CHG[el.dataset.change]&&CHG[el.dataset.change](el);return}
  if(!el.dataset||!el.dataset.bind)return;
  setBind(el.dataset.bind,readVal(el));afterBind(el,true);
});
document.addEventListener('click',ev=>{
  const a=ev.target.closest('[data-act],[data-go]');if(!a)return;
  if(a.closest('#board')&&!a.dataset.act)return;
  if(a.dataset.act){ev.preventDefault();ACT[a.dataset.act]&&ACT[a.dataset.act](a,ev)}
  else go(a.dataset.go);
});
// SVG 안의 data-go(복선 흐름 줄)도 같은 방식으로 처리됨
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();if(D&&!$('#app').classList.contains('hidden'))saveFile();return}
  if(t.id==='kwIn'){
    const c=charById(t.dataset.id);if(!c)return;
    if(ev.key==='Enter'&&!ev.isComposing){
      ev.preventDefault();
      const vs=t.value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
      if(vs.length){vs.forEach(v=>{if(!c.keywords.includes(v))c.keywords.push(v)});touch();render();const k=$('#kwIn');if(k)k.focus()}
    }else if(ev.key==='Backspace'&&!t.value&&c.keywords.length){c.keywords.pop();touch();render();const k=$('#kwIn');if(k)k.focus()}
    return;
  }
  if(t.id==='memoNew'&&ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();ACT.memoAdd();return}
  if(S.page==='rel'&&S.relSel&&(ev.key==='Delete'||ev.key==='Backspace')&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){
    ev.preventDefault();const s=S.relSel,R=D.relations;
    if(s.k==='edge')R.edges=R.edges.filter(e=>e.id!==s.id);
    if(s.k==='note')R.notes=R.notes.filter(n=>n.id!==s.id);
    if(s.k==='node'){R.nodes=R.nodes.filter(n=>n.id!==s.id);R.edges=R.edges.filter(e=>e.from!==s.id&&e.to!==s.id)}
    S.relSel=null;touch();render();
  }
  if(ev.key==='Escape'&&S.probOpen){S.probOpen=false;renderStatus()}
});

document.addEventListener('mouseover',ev=>{
  const tip=$('#tip'),t=ev.target.closest&&ev.target.closest('[data-tip]');
  if(!t||!D){tip.classList.add('hidden');return}
  const [k,id]=t.dataset.tip.split(':');let h='';
  if(k==='term'){const o=termById(id);if(!o)return;h=`<div class="tp-c">${esc(o.cat||'')}</div><b>${esc(o.name)}</b><div>${esc(o.short||'한 줄 설명 없음')}</div>`}
  else{const c=charById(id);if(!c)return;h=`${c.image?`<img src="${c.image}" class="${c.pixel?'px':''}">`:''}<b>${esc(c.name)}</b> <span class="tp-c">${esc(c.role)}</span><div>${c.keywords.map(x=>'#'+esc(x)).join(' ')||''}</div><div class="tp-c" style="clear:both">${esc((c.recent||'').slice(0,80))}</div>`}
  tip.innerHTML=h;
  const r=t.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(r.left,innerWidth-290))+'px';
  tip.style.top=(r.bottom+260>innerHeight?Math.max(8,r.top-110):r.bottom+6)+'px';
  tip.classList.remove('hidden');
});
window.addEventListener('beforeunload',()=>{if(D)autosave()});
window.addEventListener('resize',()=>{if(S.page==='rel')drawBoard()});

/* ───────── 시작 ───────── */
function showStart(){
  $('#start').classList.remove('hidden');
  let saved=null;try{saved=localStorage.getItem(LS)}catch(e){}
  const b=$('#contBtn');
  if(saved){
    b.classList.remove('hidden');
    try{const d=JSON.parse(saved);$('#contInfo').textContent=(d.info&&d.info.title?'“'+d.info.title+'”':'제목 없는 이야기')+' · 브라우저에 남은 작업'}catch(e){}
  }else b.classList.add('hidden');
}
function enterApp(){$('#start').classList.add('hidden');$('#app').classList.remove('hidden');render()}
showStart();
</script>
